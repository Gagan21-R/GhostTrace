# Netlify: build the React frontend and forward API calls to the backend on Render.
# Backend: https://ghosttrace-z69t.onrender.com (Render).
# 2) Netlify proxies /api/* to Render, so the browser only ever talks to one site (no CORS setup needed).
[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/api/*"
  to     = "https://ghosttrace-z69t.onrender.com/api/:splat"
  status = 200
  force  = true

# Single-page app: every other path loads index.html (React Router handles it).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
