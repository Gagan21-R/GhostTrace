# Full-stack deployment: PostgreSQL (pgvector), MinIO (S3-compatible evidence storage),
# Neo4j (graph mirror, optional), API (serves the built frontend) .
#   docker compose up --build      then open http://localhost:8000
# NOTE: this file was written for the target infrastructure but could not be exercised on the
# development machine (Docker was not installed). The local SQLite/filesystem mode is the tested path.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evidencex
      POSTGRES_PASSWORD: evidencex
      POSTGRES_DB: evidencex
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencex"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evidencex
      MINIO_ROOT_PASSWORD: evidencex-secret
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/evidencex-neo4j
    profiles: ["graph"]
    volumes: [neo4jdata:/data]

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://evidencex:evidencex@postgres:5432/evidencex
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: evidencex
      S3_SECRET_KEY: evidencex-secret
      S3_BUCKET: evidencex
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]

volumes:
  pgdata: {}
  miniodata: {}
  neo4jdata: {}
